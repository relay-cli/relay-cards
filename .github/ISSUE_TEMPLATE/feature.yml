name: Feature request
description: Suggest a parser, card, control, or integration.
title: 'feature: '
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: What would this help you do?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example input or interface
      description: Include a realistic sample when proposing a parser or card.
